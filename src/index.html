<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨域</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">墨域</span>
      </div>
      <div class="search-area">
        <div class="search-tabs">
          <button class="search-tab active" data-type="fuzzy">书名模糊</button>
          <button class="search-tab" data-type="title">书名精确</button>
          <button class="search-tab" data-type="author">作者</button>
          <button class="search-tab" data-type="content">内容搜索</button>
        </div>
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="输入关键词搜索..." />
          <button id="searchBtn">搜索</button>
        </div>
      </div>
    </header>

    <!-- 正在阅读状态横幅 -->
    <div id="readingBanner" class="reading-banner" style="display:none;">
      <span class="reading-banner-icon">📖</span>
      <span>正在阅读：<span id="readingBannerTitle"></span></span>
      <span class="reading-banner-divider">·</span>
      <span>已阅读 <span id="readingBannerTime">0分钟</span></span>
    </div>

    <!-- 轻量版书库引导（仅 Lite 安装包显示） -->
    <div id="libraryGuide" class="library-guide" style="display:none;">
      <span class="library-guide-icon">📦</span>
      <div class="library-guide-text">
        <strong>轻量版书库</strong> — 当前仅内置 5 本示例书。
        <div class="library-guide-hint">
          获取完整书库（2200+ 本）：点击「获取完整书库」打开 doosho/shu 仓库（Code → Download ZIP），将解压出的 <code>cn</code> / <code>en</code> / <code>yi</code> 三个文件夹复制到书库目录，然后点击「重新扫描」。
        </div>
      </div>
      <button id="fetchLibraryBtn" class="library-guide-btn">获取完整书库</button>
      <button id="openLibraryDirBtn" class="library-guide-btn">打开书库目录</button>
      <button id="rescanLibraryBtn" class="library-guide-btn primary">重新扫描</button>
    </div>

    <!-- 主体 -->
    <div class="main-body">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <nav class="nav-menu">
          <div class="nav-section">
            <div class="nav-section-title">书库</div>
            <button class="nav-item active" data-view="cn">
              <span class="nav-icon">🇨🇳</span>
              <span class="nav-label">中文</span>
              <span class="nav-count" id="count-cn">0</span>
            </button>
            <button class="nav-item" data-view="en">
              <span class="nav-icon">📖</span>
              <span class="nav-label">英文</span>
              <span class="nav-count" id="count-en">0</span>
            </button>
            <button class="nav-item" data-view="yi">
              <span class="nav-icon">🌐</span>
              <span class="nav-label">译文</span>
              <span class="nav-count" id="count-yi">0</span>
            </button>
            <button class="nav-item" data-view="local">
              <span class="nav-icon">📥</span>
              <span class="nav-label">导入</span>
              <span class="nav-count" id="count-local">0</span>
            </button>
          </div>
          <div class="nav-section">
            <div class="nav-section-title">我的</div>
            <button class="nav-item" data-view="shelf">
              <span class="nav-icon">🔖</span>
              <span class="nav-label">书架</span>
              <span class="nav-count" id="count-shelf">0</span>
            </button>
          </div>
        </nav>
        <div class="sidebar-footer">
          <div class="total-time">
            <span class="time-label">总阅读时长</span>
            <span class="time-value" id="totalTime">0分钟</span>
          </div>
        </div>
      </aside>

      <!-- 内容区 -->
      <main class="content">
        <!-- 导入工具栏 -->
        <div id="importToolbar" class="import-toolbar" style="display:none;">
          <button id="importBtn" class="import-btn">导入书籍</button>
          <button id="openImportDirBtn" class="import-btn secondary">打开导入目录</button>
          <span class="import-hint">支持 TXT / EPUB / MOBI，文件将复制到本地导入目录</span>
        </div>
        <!-- 书籍网格 -->
        <div id="bookGrid" class="book-grid"></div>
        <!-- 搜索结果 -->
        <div id="searchResults" class="search-results" style="display:none;"></div>
        <!-- 书架 -->
        <div id="shelfView" class="shelf-view" style="display:none;"></div>
        <!-- 加载提示 -->
        <div id="loading" class="loading" style="display:none;">
          <div class="spinner"></div>
          <p>正在搜索...</p>
        </div>
        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display:none;">
          <p>暂无数据</p>
        </div>
      </main>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
